<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Updating LabCEI…</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background:#f8fafc; color:#0f172a; display:flex; min-height:100vh;
           align-items:center; justify-content:center; margin:0; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:14px;
            padding:28px 32px; max-width:420px; text-align:center;
            box-shadow:0 2px 8px rgba(15,23,42,0.06); }
    h1 { font-size:18px; margin:0 0 8px; }
    p  { font-size:14px; color:#64748b; margin:6px 0; }
    .spinner { width:28px; height:28px; border:3px solid #e2e8f0;
               border-top-color:#1e40af; border-radius:50%;
               margin:14px auto; animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <h1>Updating LabCEI</h1>
    <div class="spinner"></div>
    <p id="status">Clearing the old cached version…</p>
  </div>
  <script>
    (async function () {
      var status = document.getElementById('status');
      try {
        if ('serviceWorker' in navigator) {
          var regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(function (r) { return r.unregister(); }));
        }
        if (window.caches && caches.keys) {
          var keys = await caches.keys();
          await Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }
        status.textContent = 'Done! Loading the latest version…';
      } catch (e) {
        status.textContent = 'Cleanup issue (' + e + ') — reloading anyway…';
      }
      // Hard-navigate to the app with a cache-buster; no SW is registered now.
      setTimeout(function () {
        location.replace('/?fresh=' + Date.now());
      }, 600);
    })();
  </script>
</body>
</html>
