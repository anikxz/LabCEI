# ============================================================================
# LabCEI — nginx site config (Linux deployment)
#
# Serves the Expo web build (dist/) as a static SPA + PWA, and reverse-proxies
# /api/* to the Node API (api/, default port 3001).
#
# Install:
#   1. Build the frontend:        npm run build         (outputs ./dist)
#      Make sure EXPO_PUBLIC_API_URL points at this server before building,
#      e.g.  EXPO_PUBLIC_API_URL=https://labcei.example.com npm run build
#   2. Copy this file:            sudo cp deploy/nginx.conf /etc/nginx/sites-available/labcei
#   3. Enable it:                 sudo ln -s /etc/nginx/sites-available/labcei /etc/nginx/sites-enabled/
#   4. Edit the paths/domain marked  # EDIT  below.
#   5. Test + reload:             sudo nginx -t && sudo systemctl reload nginx
#
# Run the API separately (e.g. with pm2 or systemd) on 127.0.0.1:3001.
# ============================================================================

server {
    listen 80;
    listen [::]:80;

    server_name labcei.example.com;          # EDIT: your domain or server IP

    # Absolute path to the built frontend (the `dist` folder produced by `npm run build`)
    root /var/www/labcei/dist;               # EDIT: where you copied dist/
    index index.html;

    # Match the API's 10 MB upload limit (express.json + multer)
    client_max_body_size 10m;

    # ── Compression ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/manifest+json image/svg+xml;

    # ── API reverse proxy ──────────────────────────────────────────────────
    # Everything under /api/* goes to the Node/Express server.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;    # EDIT if the API runs elsewhere
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Service worker ──────────────────────────────────────────────────────
    # Must not be cached and must be allowed to control the whole origin.
    location = /sw.js {
        add_header Content-Type            "application/javascript";
        add_header Service-Worker-Allowed  "/";
        add_header Cache-Control           "no-cache";
        try_files $uri =404;
    }

    # ── PWA manifest ────────────────────────────────────────────────────────
    location = /manifest.json {
        add_header Content-Type  "application/manifest+json";
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ── PWA icons / favicon (served directly, never SPA-fallback) ───────────
    location ~* ^/(icon-192\.png|icon-512\.png|favicon\.png)$ {
        try_files $uri =404;
    }

    # ── Hashed static assets — long cache ───────────────────────────────────
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback ────────────────────────────────────────────────────────
    # Any other path is handled client-side by expo-router.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}

# ── HTTPS note ──────────────────────────────────────────────────────────────
# For production, add TLS (recommended — service workers require HTTPS except on
# localhost). Easiest path:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d labcei.example.com
# Certbot will rewrite this server block to listen on 443 and redirect 80 → 443.
